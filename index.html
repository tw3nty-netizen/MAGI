<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAGI — duoCo/QHM Hardware Mode Scanner</title>
<style>
:root{--bg:#050505;--panel:#100800;--or:#ff6600;--gr:#39ff14;--cy:#00c8ff;--re:#ff0033;--text:#f0dfc0;--dim:#725438;--border:#321800;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b0c00,#050505 55%);color:var(--text);min-height:100vh;padding:18px}.app{max-width:680px;margin:auto}.title{letter-spacing:.18em;color:var(--or);font-weight:800;font-size:1.6rem}.sub{color:var(--dim);font-family:monospace;margin:.35rem 0 1rem}.panel{background:linear-gradient(150deg,var(--panel),#060300);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0;box-shadow:0 0 20px #0008}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
button{background:#080400;color:var(--or);border:1px solid var(--or);border-radius:6px;padding:12px 14px;font-weight:700;letter-spacing:.08em;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button.good{color:var(--gr);border-color:var(--gr)}button.danger{color:var(--re);border-color:var(--re)}button.blue{color:var(--cy);border-color:var(--cy)}
.read{font-family:monospace;background:#050505;border:1px solid #2b1600;border-radius:6px;padding:12px;margin-top:10px;white-space:pre-wrap;color:#ffd6a0}.big{font-size:2.5rem;color:var(--gr);font-family:monospace;font-weight:800}.small{font-family:monospace;color:var(--dim);font-size:.85rem}label{display:block;color:var(--dim);font-family:monospace;margin:8px 0 4px}input[type=range]{width:100%}input[type=number]{width:100%;background:#050505;color:var(--text);border:1px solid var(--border);padding:10px;border-radius:6px;font-size:1rem}.warn{border-color:#5c2500;color:#ffb36a}.kbd{font-family:monospace;color:var(--cy)}
</style>
</head>
<body>
<div class="app">
  <div class="title">MAGI MODE SCANNER</div>
  <div class="sub">duoCo StripX / QHM / Triones-style hardware mode finder — pure Web Bluetooth</div>

  <div class="panel warn">
    <b>Use this on the cloud/QHM controller only.</b><br>
    It sends one short command at a time: <span class="kbd">BB &lt;mode&gt; &lt;speed&gt; 44</span>. No pasting loads of hex needed.
  </div>

  <div class="panel">
    <div class="row">
      <button id="connectBtn">⌁ CONNECT QHM / CLOUD</button>
      <button id="onBtn" disabled class="good">POWER ON</button>
      <button id="offBtn" disabled class="danger">POWER OFF</button>
    </div>
    <div class="read" id="status">Not connected.</div>
  </div>

  <div class="panel">
    <div class="grid">
      <div>
        <label>Mode number decimal</label>
        <input id="modeNum" type="number" min="1" max="255" value="1">
      </div>
      <div>
        <label>Speed decimal: 1 fastest, 255 slowest</label>
        <input id="speedNum" type="number" min="1" max="255" value="48">
      </div>
    </div>
    <label>Mode</label>
    <input id="modeRange" type="range" min="1" max="213" value="1">
    <label>Speed</label>
    <input id="speedRange" type="range" min="1" max="255" value="48">

    <div class="row" style="margin-top:12px">
      <button id="prevBtn" disabled>◀ MODE -</button>
      <button id="sendBtn" disabled class="blue">SEND MODE</button>
      <button id="nextBtn" disabled>MODE + ▶</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="autoBtn" disabled>▶ AUTO SCAN</button>
      <button id="stopBtn" disabled class="danger">■ STOP</button>
      <button id="markBtn" disabled class="good">★ SAVE AS WATER</button>
    </div>

    <div class="read" id="cmdBox">Command will show here.</div>
  </div>

  <div class="panel">
    <div class="small">Saved candidate</div>
    <div class="big" id="saved">—</div>
    <div class="read" id="log">Log:</div>
  </div>
</div>
<script>
const SVC_FFD5='0000ffd5-0000-1000-8000-00805f9b34fb';
const CHR_FFD9='0000ffd9-0000-1000-8000-00805f9b34fb';
const SVC_FFE5='0000ffe5-0000-1000-8000-00805f9b34fb';
const CHR_FFE9='0000ffe9-0000-1000-8000-00805f9b34fb';
const SVC_FFE0='0000ffe0-0000-1000-8000-00805f9b34fb';
const CHR_FFE1='0000ffe1-0000-1000-8000-00805f9b34fb';
let device=null, char=null, type='unknown', autoTimer=null;
const $=id=>document.getElementById(id);
function hex2(n){return Math.max(0,Math.min(255,Number(n)||0)).toString(16).padStart(2,'0').toUpperCase()}
function log(msg){$('log').textContent += '\n' + new Date().toTimeString().slice(0,8) + '  ' + msg; $('log').scrollTop=$('log').scrollHeight;}
function setStatus(msg){$('status').textContent=msg;}
function setEnabled(on){['onBtn','offBtn','prevBtn','sendBtn','nextBtn','autoBtn','markBtn'].forEach(id=>$(id).disabled=!on)}
function syncInputs(src){
  if(src==='range'){ $('modeNum').value=$('modeRange').value; $('speedNum').value=$('speedRange').value; }
  else { $('modeRange').value=$('modeNum').value; $('speedRange').value=$('speedNum').value; }
  updateCmdBox();
}
function cmdMode(){const m=Number($('modeNum').value), s=Number($('speedNum').value);return new Uint8Array([0xBB,m&255,s&255,0x44]);}
function updateCmdBox(){const m=Number($('modeNum').value), s=Number($('speedNum').value);$('cmdBox').textContent=`Decimal mode: ${m}\nHex mode: 0x${hex2(m)}\nSpeed: ${s} / 0x${hex2(s)}\nCommand: BB ${hex2(m)} ${hex2(s)} 44`;}
async function writeBytes(bytes){if(!char) throw new Error('Not connected'); await char.writeValueWithoutResponse(bytes).catch(async()=>char.writeValue(bytes));}
async function connect(){
  if(!navigator.bluetooth){alert('Web Bluetooth needs Chrome or Edge. Firefox will not work.');return;}
  try{
    setStatus('Opening Bluetooth chooser...');
    device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC_FFD5,SVC_FFE5,SVC_FFE0]});
    device.addEventListener('gattserverdisconnected',()=>{char=null;setEnabled(false);setStatus('Disconnected.');log('Disconnected');});
    setStatus('Connecting to '+(device.name||'device')+'...');
    const server=await device.gatt.connect();
    try{const s=await server.getPrimaryService(SVC_FFD5); char=await s.getCharacteristic(CHR_FFD9); type='FFD5/FFD9';}
    catch(e1){try{const s=await server.getPrimaryService(SVC_FFE5); char=await s.getCharacteristic(CHR_FFE9); type='FFE5/FFE9';}
    catch(e2){const s=await server.getPrimaryService(SVC_FFE0); char=await s.getCharacteristic(CHR_FFE1); type='FFE0/FFE1';}}
    setEnabled(true); setStatus(`Connected: ${device.name||'Unknown'}\nProtocol: ${type}\nReady to scan modes.`); log('Connected '+(device.name||'Unknown')+' using '+type);
  }catch(e){setStatus('Connect failed: '+e.message); log('Connect failed: '+e.message);}
}
async function powerOn(){await writeBytes(new Uint8Array([0xCC,0x23,0x33])); log('Power ON: CC 23 33');}
async function powerOff(){await writeBytes(new Uint8Array([0xCC,0x24,0x33])); log('Power OFF: CC 24 33');}
async function sendMode(){const c=cmdMode(); await writeBytes(c); const m=Number($('modeNum').value), s=Number($('speedNum').value); log(`Mode ${m} / 0x${hex2(m)} speed ${s} command BB ${hex2(m)} ${hex2(s)} 44`);}
async function step(delta){let m=Number($('modeNum').value)+delta; if(m<1)m=213; if(m>213)m=1; $('modeNum').value=m; $('modeRange').value=m; updateCmdBox(); await sendMode();}
function autoScan(){ if(autoTimer){return;} $('autoBtn').disabled=true; $('stopBtn').disabled=false; log('Auto scan started'); autoTimer=setInterval(()=>step(1).catch(e=>{log('Auto error '+e.message); stopAuto();}),1500); }
function stopAuto(){ if(autoTimer){clearInterval(autoTimer); autoTimer=null;} $('autoBtn').disabled=!char; $('stopBtn').disabled=true; log('Auto scan stopped'); }
function mark(){const m=Number($('modeNum').value), s=Number($('speedNum').value); localStorage.setItem('magi_duoco_water_mode',JSON.stringify({mode:m,speed:s,hex:`BB ${hex2(m)} ${hex2(s)} 44`})); $('saved').textContent=`Mode ${m} / BB ${hex2(m)} ${hex2(s)} 44`; log('Saved water candidate: '+$('saved').textContent);}
$('connectBtn').onclick=connect; $('onBtn').onclick=()=>powerOn().catch(e=>log(e.message)); $('offBtn').onclick=()=>powerOff().catch(e=>log(e.message)); $('sendBtn').onclick=()=>sendMode().catch(e=>log(e.message)); $('prevBtn').onclick=()=>step(-1); $('nextBtn').onclick=()=>step(1); $('autoBtn').onclick=autoScan; $('stopBtn').onclick=stopAuto; $('markBtn').onclick=mark;
$('modeRange').oninput=()=>syncInputs('range'); $('speedRange').oninput=()=>syncInputs('range'); $('modeNum').oninput=()=>syncInputs('num'); $('speedNum').oninput=()=>syncInputs('num');
const saved=localStorage.getItem('magi_duoco_water_mode'); if(saved){try{const o=JSON.parse(saved);$('saved').textContent=`Mode ${o.mode} / ${o.hex}`;}catch{}}
updateCmdBox();
</script>
</body>
</html>
